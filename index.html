<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgEl Tech — Tecnología y Accesorios</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a0a;--surface:#141414;--surface2:#1e1e1e;--border:#2a2a2a;
  --text:#f0f0f0;--text2:#999;--accent:#00d4aa;--accent2:#00b894;
  --danger:#ff4757;--badge-new:#6c5ce7;--badge-pop:#fdcb6e;--badge-sale:#ff6b6b;
  --radius:12px;--shadow:0 4px 20px rgba(0,0,0,.4);
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
a{color:var(--accent);text-decoration:none}

/* NAV */
nav{position:sticky;top:0;z-index:100;background:rgba(10,10,10,.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:0 24px}
.nav-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{font-size:1.5rem;font-weight:800;letter-spacing:-1px}
.logo span{color:var(--accent)}
.nav-actions{display:flex;align-items:center;gap:16px}
.nav-search{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 14px;color:var(--text);width:220px;font-size:.9rem;outline:none;transition:border .2s}
.nav-search:focus{border-color:var(--accent)}
.cart-btn{position:relative;background:none;border:none;color:var(--text);cursor:pointer;font-size:1.4rem;padding:8px}
.cart-count{position:absolute;top:0;right:0;background:var(--accent);color:#000;font-size:.65rem;font-weight:700;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.cart-count[data-count="0"]{display:none}

/* HERO */
.hero{text-align:center;padding:60px 24px 40px;background:linear-gradient(180deg,#0f1a17 0%,var(--bg) 100%)}
.hero h1{font-size:clamp(2rem,5vw,3.2rem);font-weight:800;letter-spacing:-1px;margin-bottom:12px}
.hero h1 span{color:var(--accent)}
.hero p{color:var(--text2);font-size:1.1rem;max-width:500px;margin:0 auto}

/* CATEGORIES */
.categories{display:flex;gap:8px;justify-content:center;padding:20px 24px;flex-wrap:wrap}
.cat-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text2);padding:8px 18px;border-radius:20px;cursor:pointer;font-size:.85rem;transition:all .2s}
.cat-btn:hover,.cat-btn.active{background:var(--accent);color:#000;border-color:var(--accent);font-weight:600}

/* GRID */
.products{max-width:1200px;margin:0 auto;padding:20px 24px 60px;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
.product-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:transform .2s,box-shadow .2s;cursor:pointer}
.product-card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.product-img{width:100%;height:220px;display:flex;align-items:center;justify-content:center;font-size:5rem;user-select:none}
.product-body{padding:16px}
.product-badge{display:inline-block;padding:3px 10px;border-radius:6px;font-size:.7rem;font-weight:700;text-transform:uppercase;margin-bottom:8px}
.badge-Popular,.badge-Top.Ventas{background:var(--badge-pop);color:#000}
.badge-Nuevo{background:var(--badge-new);color:#fff}
.badge-Oferta{background:var(--badge-sale);color:#fff}
.badge-Premium{background:linear-gradient(135deg,#a29bfe,#6c5ce7);color:#fff}
.product-name{font-size:1rem;font-weight:700;margin-bottom:6px;line-height:1.3}
.product-desc{font-size:.82rem;color:var(--text2);margin-bottom:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.product-specs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px}
.spec-tag{background:var(--surface2);padding:2px 8px;border-radius:4px;font-size:.7rem;color:var(--text2)}
.product-footer{display:flex;align-items:center;justify-content:space-between}
.product-price{font-size:1.3rem;font-weight:800;color:var(--accent)}
.add-btn{background:var(--accent);color:#000;border:none;padding:8px 16px;border-radius:8px;font-weight:700;font-size:.85rem;cursor:pointer;transition:background .2s}
.add-btn:hover{background:var(--accent2)}
.add-btn.added{background:#333;color:var(--accent)}
.amazon-btn{background:#FF9900;color:#000;border:none;padding:8px 16px;border-radius:8px;font-weight:700;font-size:.85rem;cursor:pointer;transition:background .2s;display:inline-flex;align-items:center;gap:4px}
.amazon-btn:hover{background:#e88a00}
.shopify-btn{background:#96BF48;color:#000;border:none;padding:8px 16px;border-radius:8px;font-weight:700;font-size:.85rem;cursor:pointer;transition:background .2s;display:inline-flex;align-items:center;gap:4px}
.shopify-btn:hover{background:#7ea63d}
.buy-buttons{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

/* CART DRAWER */
.cart-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;opacity:0;pointer-events:none;transition:opacity .3s}
.cart-overlay.open{opacity:1;pointer-events:all}
.cart-drawer{position:fixed;top:0;right:-420px;width:400px;max-width:90vw;height:100vh;background:var(--surface);border-left:1px solid var(--border);z-index:201;transition:right .3s;display:flex;flex-direction:column}
.cart-drawer.open{right:0}
.cart-header{padding:20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.cart-header h2{font-size:1.2rem;font-weight:700}
.cart-close{background:none;border:none;color:var(--text2);font-size:1.5rem;cursor:pointer}
.cart-items{flex:1;overflow-y:auto;padding:16px}
.cart-empty{text-align:center;color:var(--text2);padding:40px 20px}
.cart-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.cart-item-img{width:70px;height:70px;object-fit:cover;border-radius:8px;background:var(--surface2)}
.cart-item-info{flex:1}
.cart-item-name{font-size:.9rem;font-weight:600}
.cart-item-price{color:var(--accent);font-weight:700;font-size:.9rem}
.cart-item-qty{display:flex;align-items:center;gap:8px;margin-top:6px}
.qty-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text);width:28px;height:28px;border-radius:6px;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center}
.qty-btn:hover{border-color:var(--accent)}
.cart-item-remove{background:none;border:none;color:var(--danger);cursor:pointer;font-size:.8rem;margin-left:auto}
.cart-footer{padding:20px;border-top:1px solid var(--border)}
.cart-total{display:flex;justify-content:space-between;font-size:1.2rem;font-weight:800;margin-bottom:16px}
.cart-total span:last-child{color:var(--accent)}
.checkout-btn{width:100%;padding:14px;background:var(--accent);color:#000;border:none;border-radius:var(--radius);font-size:1rem;font-weight:800;cursor:pointer;transition:background .2s}
.checkout-btn:hover{background:var(--accent2)}
.checkout-btn:disabled{background:#333;color:#666;cursor:not-allowed}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:300;display:none;align-items:center;justify-content:center;padding:24px}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;max-width:500px;width:100%;max-height:90vh;overflow-y:auto;padding:32px}
.modal h2{font-size:1.3rem;margin-bottom:20px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:6px}
.form-group input,.form-group select{width:100%;padding:10px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.9rem;outline:none}
.form-group input:focus{border-color:var(--accent)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.order-summary{background:var(--surface2);border-radius:var(--radius);padding:16px;margin-bottom:20px}
.order-line{display:flex;justify-content:space-between;font-size:.9rem;margin-bottom:6px}
.order-line.total{font-weight:800;font-size:1.1rem;color:var(--accent);border-top:1px solid var(--border);padding-top:8px;margin-top:8px}
.pay-btn{width:100%;padding:14px;background:var(--accent);color:#000;border:none;border-radius:var(--radius);font-size:1rem;font-weight:800;cursor:pointer;margin-top:8px}
.pay-methods{display:flex;gap:8px;margin-bottom:16px}
.pay-method{flex:1;padding:12px;background:var(--surface2);border:2px solid var(--border);border-radius:var(--radius);text-align:center;cursor:pointer;font-size:.85rem;font-weight:600;transition:border .2s}
.pay-method:hover,.pay-method.active{border-color:var(--accent)}
.pay-method svg{display:block;margin:0 auto 6px;width:32px;height:32px}

/* SUCCESS */
.success-msg{text-align:center;padding:40px 20px}
.success-msg .check{font-size:4rem;margin-bottom:16px}
.success-msg h2{color:var(--accent);margin-bottom:8px}

/* FOOTER */
footer{background:var(--surface);border-top:1px solid var(--border);padding:40px 24px;text-align:center;color:var(--text2);font-size:.85rem}
footer .links{display:flex;gap:20px;justify-content:center;margin-bottom:12px;flex-wrap:wrap}

/* WHATSAPP */
.whatsapp-float{position:fixed;bottom:24px;right:24px;z-index:50;width:56px;height:56px;background:#25D366;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(37,211,102,.4);cursor:pointer;transition:transform .2s}
.whatsapp-float:hover{transform:scale(1.1)}
.whatsapp-float svg{width:28px;height:28px;fill:#fff}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--accent);color:#000;padding:12px 24px;border-radius:var(--radius);font-weight:700;font-size:.9rem;z-index:500;transition:transform .3s;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0)}

@media(max-width:600px){
  .nav-search{width:140px}
  .products{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
  .product-img{height:160px}
  .product-body{padding:12px}
  .product-desc{display:none}
  .cart-drawer{width:100%;max-width:100%}
  .modal{margin:12px;padding:24px}
  .form-row{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- NAV -->
<nav>
  <div class="nav-inner">
    <div class="logo">Ag<span>El</span> Tech</div>
    <div class="nav-actions">
      <input type="text" class="nav-search" placeholder="Buscar productos..." id="searchInput">
      <button class="cart-btn" onclick="toggleCart()">
        🛒 <span class="cart-count" id="cartCount" data-count="0">0</span>
      </button>
    </div>
  </div>
</nav>

<!-- HERO -->
<section class="hero">
  <h1>Tecnología al <span>Mejor Precio</span></h1>
  <p>Los mejores accesorios tech con envío directo a tu puerta. Sin intermediarios.</p>
</section>

<!-- CATEGORIES -->
<div class="categories" id="categories">
  <button class="cat-btn active" data-cat="all">Todos</button>
  <button class="cat-btn" data-cat="audio">Audio</button>
  <button class="cat-btn" data-cat="wearables">Wearables</button>
  <button class="cat-btn" data-cat="cargadores">Cargadores</button>
  <button class="cat-btn" data-cat="perifericos">Periféricos</button>
  <button class="cat-btn" data-cat="accesorios">Accesorios</button>
  <button class="cat-btn" data-cat="video">Video</button>
  <button class="cat-btn" data-cat="fundas">Fundas</button>
</div>

<!-- PRODUCTS -->
<div class="products" id="productsGrid"></div>

<!-- CART DRAWER -->
<div class="cart-overlay" id="cartOverlay" onclick="toggleCart()"></div>
<div class="cart-drawer" id="cartDrawer">
  <div class="cart-header">
    <h2>🛒 Tu Carrito</h2>
    <button class="cart-close" onclick="toggleCart()">&times;</button>
  </div>
  <div class="cart-items" id="cartItems">
    <div class="cart-empty">Tu carrito está vacío</div>
  </div>
  <div class="cart-footer">
    <div class="cart-total">
      <span>Total</span>
      <span id="cartTotal">$0.00</span>
    </div>
    <button class="checkout-btn" id="checkoutBtn" onclick="openCheckout()" disabled>Proceder al Pago</button>
  </div>
</div>

<!-- CHECKOUT MODAL -->
<div class="modal-overlay" id="checkoutModal">
  <div class="modal" id="modalContent"></div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- WHATSAPP -->
<a class="whatsapp-float" href="https://wa.me/1234567890?text=Hola%20AgEl%20Tech%2C%20tengo%20una%20consulta" target="_blank" title="Chat por WhatsApp">
  <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
</a>

<footer>
  <div class="links">
    <a href="#" onclick="showPage('about')">Sobre Nosotros</a>
    <a href="#" onclick="showPage('shipping')">Envíos</a>
    <a href="#" onclick="showPage('returns')">Devoluciones</a>
    <a href="#" onclick="showPage('contact')">Contacto</a>
  </div>
  <p>&copy; 2026 AgEl Tech. Todos los derechos reservados.</p>
</footer>

<script>
let products = [];
let cart = JSON.parse(localStorage.getItem('agel_cart') || '[]');
let currentCategory = 'all';

const AMAZON_TAG = 'ageltech-20';
const SHOPIFY_STORE = 'ageltech.myshopify.com';
function amazonLink(p) {
  if (p.amazon_asin) return `https://www.amazon.com/dp/${p.amazon_asin}?tag=${AMAZON_TAG}`;
  if (p.amazon_search) return `https://www.amazon.com/s?k=${p.amazon_search}&tag=${AMAZON_TAG}`;
  return `https://www.amazon.com/s?k=${encodeURIComponent(p.name)}&tag=${AMAZON_TAG}`;
}

fetch('products.json').then(r => r.json()).then(data => {
  products = data;
  renderProducts();
  updateCartUI();
}).catch(() => {
  products = [];
  document.getElementById('productsGrid').innerHTML = '<p style="text-align:center;color:var(--text2);grid-column:1/-1;padding:40px">Cargando productos...</p>';
});

document.getElementById('searchInput').addEventListener('input', e => {
  renderProducts(e.target.value.toLowerCase());
});

document.getElementById('categories').addEventListener('click', e => {
  if (!e.target.classList.contains('cat-btn')) return;
  currentCategory = e.target.dataset.cat;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  renderProducts(document.getElementById('searchInput').value.toLowerCase());
});

function renderProducts(search = '') {
  const grid = document.getElementById('productsGrid');
  const filtered = products.filter(p => {
    const matchCat = currentCategory === 'all' || p.category === currentCategory;
    const matchSearch = !search || p.name.toLowerCase().includes(search) || p.description.toLowerCase().includes(search);
    return matchCat && matchSearch;
  });
  grid.innerHTML = filtered.map(p => `
    <div class="product-card" onclick="viewProduct(${p.id})">
      <div class="product-img" style="background:${p.color || 'var(--surface2)'}">${p.icon || '📦'}</div>
      <div class="product-body">
        ${p.badge ? `<span class="product-badge badge-${p.badge}">${p.badge}</span>` : ''}
        <div class="product-name">${p.name}</div>
        <div class="product-desc">${p.description}</div>
        <div class="product-specs">${p.specs.map(s => `<span class="spec-tag">${s}</span>`).join('')}</div>
        <div class="product-footer">
          <span class="product-price">$${p.price.toFixed(2)}</span>
          <button class="add-btn" onclick="event.stopPropagation();addToCart(${p.id})">Agregar</button>
        </div>
        <div class="buy-buttons">
          <a class="amazon-btn" href="${amazonLink(p)}" target="_blank" onclick="event.stopPropagation()">Amazon</a>
          <a class="shopify-btn" href="https://${SHOPIFY_STORE}/search?q=${encodeURIComponent(p.name)}" target="_blank" onclick="event.stopPropagation()">Shopify</a>
        </div>
      </div>
    </div>
  `).join('');
}

function addToCart(id) {
  const item = cart.find(i => i.id === id);
  if (item) { item.qty++; } else { cart.push({ id, qty: 1 }); }
  saveCart();
  updateCartUI();
  showToast('Producto agregado al carrito');
}

function removeFromCart(id) {
  cart = cart.filter(i => i.id !== id);
  saveCart();
  updateCartUI();
  renderCartItems();
}

function changeQty(id, delta) {
  const item = cart.find(i => i.id === id);
  if (!item) return;
  item.qty += delta;
  if (item.qty < 1) return removeFromCart(id);
  saveCart();
  updateCartUI();
  renderCartItems();
}

function saveCart() { localStorage.setItem('agel_cart', JSON.stringify(cart)); }

function getCartTotal() {
  return cart.reduce((sum, item) => {
    const p = products.find(pr => pr.id === item.id);
    return sum + (p ? p.price * item.qty : 0);
  }, 0);
}

function updateCartUI() {
  const count = cart.reduce((s, i) => s + i.qty, 0);
  const el = document.getElementById('cartCount');
  el.textContent = count;
  el.dataset.count = count;
  document.getElementById('cartTotal').textContent = '$' + getCartTotal().toFixed(2);
  document.getElementById('checkoutBtn').disabled = cart.length === 0;
}

function toggleCart() {
  const drawer = document.getElementById('cartDrawer');
  const overlay = document.getElementById('cartOverlay');
  const isOpen = drawer.classList.contains('open');
  drawer.classList.toggle('open');
  overlay.classList.toggle('open');
  if (!isOpen) renderCartItems();
}

function renderCartItems() {
  const container = document.getElementById('cartItems');
  if (cart.length === 0) {
    container.innerHTML = '<div class="cart-empty">Tu carrito está vacío</div>';
    return;
  }
  container.innerHTML = cart.map(item => {
    const p = products.find(pr => pr.id === item.id);
    if (!p) return '';
    return `
      <div class="cart-item">
        <div class="cart-item-img" style="background:${p.color || 'var(--surface2)'};display:flex;align-items:center;justify-content:center;font-size:2rem">${p.icon || '📦'}</div>
        <div class="cart-item-info">
          <div class="cart-item-name">${p.name}</div>
          <div class="cart-item-price">$${(p.price * item.qty).toFixed(2)}</div>
          <div class="cart-item-qty">
            <button class="qty-btn" onclick="changeQty(${p.id},-1)">−</button>
            <span>${item.qty}</span>
            <button class="qty-btn" onclick="changeQty(${p.id},1)">+</button>
          </div>
        </div>
        <button class="cart-item-remove" onclick="removeFromCart(${p.id})">✕</button>
      </div>
    `;
  }).join('');
}

function openCheckout() {
  toggleCart();
  const modal = document.getElementById('checkoutModal');
  modal.classList.add('open');
  renderCheckoutForm();
}

function closeModal() {
  document.getElementById('checkoutModal').classList.remove('open');
}

function renderCheckoutForm() {
  const total = getCartTotal();
  const shipping = total > 50 ? 0 : 4.99;
  const finalTotal = total + shipping;
  document.getElementById('modalContent').innerHTML = `
    <h2>Finalizar Compra</h2>
    <div class="order-summary">
      ${cart.map(item => {
        const p = products.find(pr => pr.id === item.id);
        return p ? `<div class="order-line"><span>${p.name} x${item.qty}</span><span>$${(p.price*item.qty).toFixed(2)}</span></div>` : '';
      }).join('')}
      <div class="order-line"><span>Envío</span><span>${shipping === 0 ? 'GRATIS' : '$'+shipping.toFixed(2)}</span></div>
      <div class="order-line total"><span>Total</span><span>$${finalTotal.toFixed(2)}</span></div>
    </div>
    <div class="form-group"><label>Nombre completo</label><input type="text" id="fname" required></div>
    <div class="form-group"><label>Email</label><input type="email" id="femail" required></div>
    <div class="form-group"><label>Teléfono / WhatsApp</label><input type="tel" id="fphone" required></div>
    <div class="form-group"><label>Dirección de envío</label><input type="text" id="faddress" required></div>
    <div class="form-row">
      <div class="form-group"><label>Ciudad</label><input type="text" id="fcity" required></div>
      <div class="form-group"><label>CP / Zip</label><input type="text" id="fzip" required></div>
    </div>
    <div class="form-group"><label>País</label>
      <select id="fcountry">
        <option>Estados Unidos</option><option>México</option><option>España</option>
        <option>Colombia</option><option>Argentina</option><option>Chile</option>
        <option>Perú</option><option>Otro</option>
      </select>
    </div>
    <h3 style="margin:20px 0 12px;font-size:1rem">Método de Pago</h3>
    <div class="pay-methods">
      <div class="pay-method active" onclick="selectPay(this,'paypal')">
        <svg viewBox="0 0 24 24" fill="var(--accent)"><path d="M7.076 21.337H2.47a.641.641 0 0 1-.633-.74L4.944.901C5.026.382 5.474 0 5.998 0h7.46c2.57 0 4.578.543 5.69 1.81 1.01 1.15 1.304 2.42 1.012 4.287-.023.143-.047.288-.077.437-.983 5.05-4.349 6.797-8.647 6.797h-2.19c-.524 0-.968.382-1.05.9l-1.12 7.106zm14.146-14.42a3.35 3.35 0 0 0-.607-.541c-.013.076-.026.175-.041.254-.93 4.778-4.005 7.201-9.138 7.201h-2.19a.563.563 0 0 0-.556.479l-1.187 7.527h-.506l-.24 1.516a.56.56 0 0 0 .554.647h3.882c.46 0 .85-.334.922-.788.06-.26.76-4.852.81-5.146a.932.932 0 0 1 .92-.789h.58c3.76 0 6.705-1.528 7.565-5.946.36-1.847.174-3.388-.768-4.414z"/></svg>
        PayPal
      </div>
      <div class="pay-method" onclick="selectPay(this,'card')">
        <svg viewBox="0 0 24 24" fill="var(--text2)"><path d="M20 4H4c-1.11 0-1.99.89-1.99 2L2 18c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V6c0-1.11-.89-2-2-2zm0 14H4v-6h16v6zm0-10H4V6h16v2z"/></svg>
        Tarjeta
      </div>
    </div>
    <div id="cardFields" hidden>
      <div class="form-group"><label>Número de tarjeta</label><input type="text" id="fcard" placeholder="1234 5678 9012 3456" maxlength="19"></div>
      <div class="form-row">
        <div class="form-group"><label>Vencimiento</label><input type="text" id="fexp" placeholder="MM/AA" maxlength="5"></div>
        <div class="form-group"><label>CVV</label><input type="text" id="fcvv" placeholder="123" maxlength="4"></div>
      </div>
    </div>
    <button class="pay-btn" onclick="processOrder()">Pagar $${finalTotal.toFixed(2)}</button>
    <p style="text-align:center;margin-top:12px;font-size:.75rem;color:var(--text2)">🔒 Pago seguro · Envío 7-15 días</p>
    <button style="position:absolute;top:16px;right:16px;background:none;border:none;color:var(--text2);font-size:1.5rem;cursor:pointer" onclick="closeModal()">&times;</button>
  `;
  document.getElementById('modalContent').style.position = 'relative';
}

let selectedPay = 'paypal';
function selectPay(el, method) {
  selectedPay = method;
  document.querySelectorAll('.pay-method').forEach(m => m.classList.remove('active'));
  el.classList.add('active');
  const cf = document.getElementById('cardFields');
  if (cf) cf.hidden = method !== 'card';
}

function processOrder() {
  const name = document.getElementById('fname')?.value;
  const email = document.getElementById('femail')?.value;
  const phone = document.getElementById('fphone')?.value;
  const address = document.getElementById('faddress')?.value;
  if (!name || !email || !phone || !address) {
    showToast('Completa todos los campos');
    return;
  }
  const total = getCartTotal();
  const shipping = total > 50 ? 0 : 4.99;
  const orderItems = cart.map(item => {
    const p = products.find(pr => pr.id === item.id);
    return p ? `${p.name} x${item.qty}` : '';
  }).join(', ');

  if (selectedPay === 'paypal') {
    const ppUrl = `https://www.paypal.com/cgi-bin/webscr?cmd=_xclick&business=angelgallart%40hotmail.com&item_name=AgEl+Tech+-+${encodeURIComponent(orderItems)}&amount=${(total+shipping).toFixed(2)}&currency_code=USD&return=https://angelbdogallart-ui.github.io/agel-store/&cancel_return=https://angelbdogallart-ui.github.io/agel-store/`;
    showOrderSuccess();
    setTimeout(() => window.open(ppUrl, '_blank'), 500);
  } else {
    showOrderSuccess();
  }
}

function showOrderSuccess() {
  document.getElementById('modalContent').innerHTML = `
    <div class="success-msg">
      <div class="check">✅</div>
      <h2>Pedido Recibido</h2>
      <p style="color:var(--text2);margin-bottom:20px">Recibirás confirmación por email y WhatsApp con los detalles de envío.</p>
      <p style="font-size:.85rem;color:var(--text2)">Orden #${Date.now().toString(36).toUpperCase()}</p>
      <button class="pay-btn" style="margin-top:20px" onclick="closeModal();cart=[];saveCart();updateCartUI();">Seguir Comprando</button>
    </div>
  `;
}

function viewProduct(id) {
  const p = products.find(pr => pr.id === id);
  if (!p) return;
  const modal = document.getElementById('checkoutModal');
  modal.classList.add('open');
  document.getElementById('modalContent').innerHTML = `
    <button style="position:absolute;top:16px;right:16px;background:none;border:none;color:var(--text2);font-size:1.5rem;cursor:pointer" onclick="closeModal()">&times;</button>
    <div style="width:100%;height:260px;border-radius:var(--radius);margin-bottom:20px;background:${p.color || 'var(--surface2)'};display:flex;align-items:center;justify-content:center;font-size:7rem">${p.icon || '📦'}</div>
    ${p.badge ? `<span class="product-badge badge-${p.badge}">${p.badge}</span>` : ''}
    <h2 style="margin-bottom:8px">${p.name}</h2>
    <p style="color:var(--text2);margin-bottom:16px;font-size:.95rem">${p.description}</p>
    <div class="product-specs" style="margin-bottom:20px">${p.specs.map(s => `<span class="spec-tag" style="font-size:.8rem;padding:4px 10px">${s}</span>`).join('')}</div>
    <div style="display:flex;align-items:center;justify-content:space-between">
      <span class="product-price" style="font-size:1.8rem">$${p.price.toFixed(2)}</span>
      <button class="add-btn" style="padding:12px 28px;font-size:1rem" onclick="addToCart(${p.id});closeModal()">Agregar al Carrito</button>
    </div>
    <div style="display:flex;gap:10px;margin-top:16px">
      <a class="amazon-btn" style="padding:12px 24px;font-size:1rem;flex:1;justify-content:center" href="${amazonLink(p)}" target="_blank">Comprar en Amazon</a>
      <a class="shopify-btn" style="padding:12px 24px;font-size:1rem;flex:1;justify-content:center" href="https://${SHOPIFY_STORE}/search?q=${encodeURIComponent(p.name)}" target="_blank">Ver en Shopify</a>
    </div>
    <p style="margin-top:16px;font-size:.8rem;color:var(--text2)">🚚 Envío gratis en pedidos +$50 · 📦 Entrega 7-15 días · 🔄 30 días devolución</p>
  `;
  document.getElementById('modalContent').style.position = 'relative';
}

document.getElementById('checkoutModal').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

function showPage(page) {
  const pages = {
    about: '<h2>Sobre AgEl Tech</h2><p style="margin-top:12px;color:var(--text2)">Somos una tienda especializada en tecnología y accesorios al mejor precio. Trabajamos directamente con fabricantes para ofrecerte los mejores productos sin intermediarios.</p>',
    shipping: '<h2>Envíos</h2><p style="margin-top:12px;color:var(--text2)">Envío estándar: 7-15 días hábiles. Envío gratis en pedidos mayores a $50. Envío express disponible por un costo adicional. Rastreo incluido en todos los envíos.</p>',
    returns: '<h2>Devoluciones</h2><p style="margin-top:12px;color:var(--text2)">Tienes 30 días para devolver cualquier producto sin usar en su empaque original. Contacta a soporte para iniciar el proceso.</p>',
    contact: '<h2>Contacto</h2><p style="margin-top:12px;color:var(--text2)">WhatsApp: +1 234 567 890<br>Email: soporte@ageltech.com<br>Horario: Lun-Vie 9am-6pm</p>'
  };
  const modal = document.getElementById('checkoutModal');
  modal.classList.add('open');
  document.getElementById('modalContent').innerHTML = `
    <button style="position:absolute;top:16px;right:16px;background:none;border:none;color:var(--text2);font-size:1.5rem;cursor:pointer" onclick="closeModal()">&times;</button>
    ${pages[page] || ''}
  `;
  document.getElementById('modalContent').style.position = 'relative';
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
</script>
</body>
</html>
